{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Register Page{% endblock %}

{% block content %}
    <h3>register</h3>

    <div class="row">
        <div class="col-4">
            <form method="post">
                {% csrf_token %}
                {{ register_form | crispy }}

                <button class="btn btn-primary">Register</button>  <span class="ms-3">No account? Then, <a href="#">get registered</a></span>
            </form>
        </div>
    </div>

{% endblock %}
